# Project-wide Gradle settings (Maximum R8 Full-Mode Optimization & Play Delivery)
org.gradle.jvmargs=-Xmx2048m -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX & Path Settings
android.useAndroidX=true
android.overridePathCheck=true
android.suppressUnsupportedCompileSdk=36

# Maximum R8 Full Mode, Resource Shrinking & Non-Transitive R Classes
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.nonTransitiveRClass=true
