name: Android Google Play Release (.aab & .apk)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-playstore:
    name: Build Signed Android App Bundle (.aab) & APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAY_SA_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm ci
          npm run generate:icons
          npm run build
          npx cap sync android

      - name: Prepare Upload Keystore for Release Signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p android/keystore
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/keystore/upload-keystore.jks
            echo "STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${ANDROID_KEY_ALIAS}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${ANDROID_KEY_PASSWORD}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore android/keystore/upload-keystore.jks \
              -alias zihinharitam-upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "ZihinHaritamPlay2026!" \
              -keypass "ZihinHaritamPlay2026!" \
              -dname "CN=Taha Firat, OU=Mobile, O=ZihinHaritam, L=Istanbul, ST=Istanbul, C=TR"
            echo "STORE_PASSWORD=ZihinHaritamPlay2026!" >> $GITHUB_ENV
            echo "KEY_ALIAS=zihinharitam-upload" >> $GITHUB_ENV
            echo "KEY_PASSWORD=ZihinHaritamPlay2026!" >> $GITHUB_ENV
          fi

      - name: Build Signed Play Store AAB & Universal APK
        working-directory: android
        env:
          ZH_UPLOAD_STORE_FILE: ${{ github.workspace }}/android/keystore/upload-keystore.jks
          ZH_UPLOAD_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          ZH_UPLOAD_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          ZH_UPLOAD_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Stage Play Store Submission Package
        run: |
          mkdir -p playstore-dist
          cp android/app/build/outputs/bundle/release/app-release.aab playstore-dist/ZihinHaritam-v1.0.2-b18-release.aab
          cp android/app/build/outputs/apk/release/app-release.apk playstore-dist/ZihinHaritam-v1.0.2-b18-release.apk
          cp -r playstore-submission/* playstore-dist/ || true
          ls -lh playstore-dist/

      - name: Upload Play Store Bundle (.aab + .apk + Graphics) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZihinHaritam-GooglePlay-Release-Bundle
          path: playstore-dist/
          retention-days: 90

      - name: Publish Signed .aab & .apk to GitHub Release v1.0.2-build15
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2-build15
          name: ZihinHaritam v1.0.2 (Build 15/18 — iOS & Android Play Store)
          files: |
            playstore-dist/ZihinHaritam-v1.0.2-b18-release.aab
            playstore-dist/ZihinHaritam-v1.0.2-b18-release.apk

      - name: Upload directly to Google Play Console (when Service Account Secret is set)
        if: env.PLAY_SA_JSON != ''
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.tahafirat.zihinharitam
          releaseFiles: playstore-dist/ZihinHaritam-v1.0.2-b18-release.aab
          track: internal
          status: completed
          whatsNewDirectory: playstore-submission/metadata/tr-TR/changelogs
