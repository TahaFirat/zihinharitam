name: Deploy Legal & Support Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare official product, support & legal pages
        run: |
          mkdir -p _site/screenshots
          cp public/landing.html _site/index.html
          cp public/privacy.html _site/privacy.html
          cp public/terms.html _site/terms.html
          cp public/support.html _site/support.html
          if [ -d "appstore-submission/screenshots/iphone-6.9" ]; then
            cp appstore-submission/screenshots/iphone-6.9/*.png _site/screenshots/ || true
          fi
          for vid in public/review-demo.mp4 public/review-demo.mov public/review-demo.html; do
            if [ -f "$vid" ]; then
              cp "$vid" _site/
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
