name: iOS App Store Release

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Uygulama Sürümü (CFBundleShortVersionString)'
        required: false
        default: '1.0.0'
        type: string
      build_number:
        description: 'Özel Build Numarası (boş bırakılırsa github.run_number kullanılır)'
        required: false
        default: ''
        type: string
      upload_to_appstore:
        description: 'Derlenen .ipa doğrudan App Store Connect / TestFlight’a yüklensin mi?'
        required: false
        default: true
        type: boolean
      sync_store_metadata:
        description: 'TR/EN mağaza metinleri, 15 ekran görüntüsü ve 200 TL IAP API ile senkronize edilsin mi?'
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  build-sign-and-upload-ios:
    name: Build, Sign & Upload ZihinHaritam (.ipa) to App Store Connect
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Stable Xcode 16+
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Zero-Alpha App Icons, Offline Shards & Production Build
        run: |
          npm run generate:icons
          npm run build

      - name: Sync Web Bundle & StoreKit 2 Plugin to Capacitor iOS
        run: |
          npx cap sync ios
          cd ios/App && pod install

      - name: Prepare App Store Connect API Key (.p8), Keychain & Provisioning Profile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_P8: ${{ secrets.APPSTORE_PRIVATE_KEY_P8 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${APPLE_TEAM_ID:-}" ] || [ -z "${APPSTORE_KEY_ID:-}" ] || [ -z "${APPSTORE_ISSUER_ID:-}" ] || [ -z "${APPSTORE_PRIVATE_KEY_P8:-}" ]; then
            echo "::error::Eksik GitHub Secret! APPLE_TEAM_ID, APPSTORE_KEY_ID, APPSTORE_ISSUER_ID ve APPSTORE_PRIVATE_KEY_P8 tanımlanmalıdır."
            exit 1
          fi

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf "%s\n" "$APPSTORE_PRIVATE_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASS="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          if [ -n "${BUILD_CERTIFICATE_BASE64:-}" ]; then
            CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
            printf "%s" "$BUILD_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 --decode > "$CERT_PATH"
          else
            echo "==> BUILD_CERTIFICATE_BASE64 tanımlı değil; App Store Connect API ile Distribution sertifikası hazırlanıyor..."
            P12_PASSWORD="$(uuidgen)"
            APPSTORE_PRIVATE_KEY_PATH="$KEY_PATH" P12_PASSWORD="$P12_PASSWORD" node scripts/create-apple-dist-cert.mjs
            CERT_PATH=".secrets/apple_distribution.p12"
          fi

          security import "$CERT_PATH" -P "${P12_PASSWORD:-}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          SIGNING_STYLE="automatic"
          PROFILE_SPECIFIER=""
          PROFILE_UUID=""
          if [ -n "${BUILD_PROVISION_PROFILE_BASE64:-}" ]; then
            PP_PATH="$RUNNER_TEMP/build.mobileprovision"
            printf "%s" "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '[:space:]' | base64 --decode > "$PP_PATH"
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            DECODED_PLIST="$RUNNER_TEMP/profile.plist"
            /usr/bin/security cms -D -i "$PP_PATH" > "$DECODED_PLIST"
            PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$DECODED_PLIST")
            PP_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$DECODED_PLIST")
            cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PP_UUID}.mobileprovision"
            SIGNING_STYLE="manual"
            PROFILE_SPECIFIER="$PP_NAME"
            PROFILE_UUID="$PP_UUID"
            echo "Installed Provisioning Profile: $PP_NAME ($PP_UUID)"
          fi
          echo "SIGNING_STYLE=$SIGNING_STYLE" >> "$GITHUB_ENV"
          echo "PROFILE_SPECIFIER=$PROFILE_SPECIFIER" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Configure App Target Signing & Build Version
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUILD_NUM="${{ inputs.build_number }}"
          if [ -z "$BUILD_NUM" ]; then
            BUILD_NUM="${{ github.run_number }}"
          fi
          MARKETING_VER="${{ inputs.marketing_version }}"
          if [ -z "$MARKETING_VER" ]; then
            MARKETING_VER="1.0.0"
          fi

          cd ios/App
          xcrun agvtool new-marketing-version "$MARKETING_VER"
          xcrun agvtool new-version -all "$BUILD_NUM"
          cd ../..

          # Scope Manual/Automatic signing strictly to App target in project.pbxproj (never Pods!)
          node -e '
            const fs = require("fs");
            const pbxPath = "ios/App/App.xcodeproj/project.pbxproj";
            let pbx = fs.readFileSync(pbxPath, "utf8");
            const teamId = process.env.APPLE_TEAM_ID;
            const style = process.env.SIGNING_STYLE;
            const spec = process.env.PROFILE_SPECIFIER;
            if (style === "manual") {
              pbx = pbx.replace(/ProvisioningStyle = Automatic;/g, "ProvisioningStyle = Manual;");
              pbx = pbx.replace(
                /CODE_SIGN_STYLE = Automatic;\s*(CURRENT_PROJECT_VERSION = [^;]+;)/g,
                `CODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = ${teamId};\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "${spec}";\n\t\t\t\t$1`
              );
            } else {
              pbx = pbx.replace(
                /CODE_SIGN_STYLE = Automatic;\s*(CURRENT_PROJECT_VERSION = [^;]+;)/g,
                `CODE_SIGN_STYLE = Automatic;\n\t\t\t\tDEVELOPMENT_TEAM = ${teamId};\n\t\t\t\t$1`
              );
            }
            fs.writeFileSync(pbxPath, pbx, "utf8");
          '
          echo "Configured App target signing ($SIGNING_STYLE) for MARKETING_VERSION=$MARKETING_VER, BUILD=$BUILD_NUM"

      - name: Archive Release iOS App (xcodebuild archive)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p build

          if [ "$SIGNING_STYLE" = "manual" ]; then
            xcodebuild -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              archive
          else
            xcodebuild -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$APPSTORE_KEY_ID" \
              -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
              archive
          fi

      - name: Generate ExportOptions.plist & Export Signed .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p build/ipa

          node -e '
            const fs = require("fs");
            const teamId = process.env.APPLE_TEAM_ID;
            const style = process.env.SIGNING_STYLE;
            const spec = process.env.PROFILE_SPECIFIER;
            const xml = style === "manual"
              ? `<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${teamId}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tahafirat.zihinharitam</key>
              <string>${spec}</string>
            </dict>
          </dict>
          </plist>\n`.replace(/^          /gm, "")
              : `<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${teamId}</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>\n`.replace(/^          /gm, "");
            fs.writeFileSync("build/ExportOptions.plist", xml, "utf8");
          '

          if [ "$SIGNING_STYLE" = "manual" ]; then
            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportOptionsPlist build/ExportOptions.plist \
              -exportPath build/ipa
          else
            xcodebuild -exportArchive \
              -archivePath build/App.xcarchive \
              -exportOptionsPlist build/ExportOptions.plist \
              -exportPath build/ipa \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$APPSTORE_KEY_ID" \
              -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID"
          fi

          ls -lh build/ipa

      - name: Upload .ipa Directly to App Store Connect / TestFlight
        if: ${{ inputs.upload_to_appstore != false }}
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_FILE=$(ls build/ipa/*.ipa | head -n 1)
          echo "Uploading $IPA_FILE to App Store Connect..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_FILE" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Sync TR/EN Store Metadata, 15 Screenshots & 200 TL IAP via ASC API
        if: ${{ inputs.sync_store_metadata != false }}
        continue-on-error: true
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_P8: ${{ secrets.APPSTORE_PRIVATE_KEY_P8 }}
          APPSTORE_PUBLIC_BASE_URL: ${{ vars.APPSTORE_PUBLIC_BASE_URL }}
        run: |
          node scripts/appstore-connect-api-submit.mjs

      - name: Save Signed .ipa & App Store Submission Kit as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zihinharitam-appstore-release-${{ github.run_number }}
          path: |
            build/ipa/*.ipa
            appstore-submission/**
          retention-days: 30
